#MySQL Configuration (Railway)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.servlet.context-path=/api/v1.0

#JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#Swagger/OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

#Email configuration
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_USERNAME}
spring.mail.password=${BREVO_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.from=${MAIL_FROM_ADDRESS}

jwt.secret=${JWT_SECRET}

fintrackr.frontend.url=${FRONTEND_URL}

app.activation.url=${BACKEND_URL}

# Groq AI Configuration
groq.api.key=${GROQ_API_KEY}
groq.model=llama-3.1-8b-instant
groq.api.url=https://api.groq.com/openai/v1/chat/completions

gemini.api.key=
gemini.model=gemini-2.5-flash
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
